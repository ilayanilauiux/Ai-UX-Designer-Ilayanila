<style>
:root{
  --page:#F4F6FA; --card:#FFFFFF; --card-bd:#E6EBF2; --card-sh:0 1px 2px rgba(15,23,42,.04);
  --ink:#1F1F1F; --ink2:#5B6472; --ink3:#6B7584; --line:#E3E9F0; --head-bg:#FFFFFF;
  --nav:#171272; --nav-act:#3B2FD9; --nav-txt:#E9ECFA; --nav-mut:#B9C1EE; --nav-btn:#2D2A9C;
  --tab-on:#2563EB; --tab-on-t:#FFFFFF; --tab-off:#F1F5F9; --tab-off-t:#1F1F1F;
  --chip-bd:#D6DEE9; --chip-bg:#FFFFFF;
  --rail-box:#E7F1FE; --rail-item:#FFFFFF;
  --blur:none;
  --g-bg:#EAF8EF; --g-bd:transparent; --b-bg:#E8F1FE; --p-bg:#F7EEFE; --r-bg:#FEECEC;
  --ev-b:#EEF4FE; --ev-bt:#1D4ED8; --ev-p:#FDF1F5; --ev-pt:#BE185D; --ev-v:#FCF0FB; --ev-vt:#7E22CE; --ev-o:#FFF4E8; --ev-ot:#C2410C;
  --ev-sub:#5B6472; --ev-ink:#1F1F1F;
  --pal-blue:#2563EB; --pal-green:#16A34A; --pal-red:#EF4444; --pal-ind:#6366F1; --pal-ora:#EA580C;
  --hole:#FFFFFF; --focus:#2563EB;
}
html[data-theme="dark"]{
  --page:#090C14; --card:rgba(255,255,255,.065); --card-bd:rgba(255,255,255,.15); --card-sh:0 1px 0 rgba(255,255,255,.14) inset,0 14px 34px -12px rgba(0,0,0,.65);
  --ink:#EEF1F6; --ink2:#B7C0CE; --ink3:#AAB4C4; --line:rgba(255,255,255,.12); --head-bg:rgba(10,13,26,.62);
  --nav:rgba(11,10,48,.7); --nav-act:#4338CA; --nav-txt:#EEF1FA; --nav-mut:#B9C4E0; --nav-btn:rgba(99,102,241,.35);
  --tab-on:#3B6DF0; --tab-on-t:#FFFFFF; --tab-off:rgba(255,255,255,.08); --tab-off-t:#EEF1F6;
  --chip-bd:rgba(255,255,255,.22); --chip-bg:rgba(255,255,255,.05);
  --rail-box:rgba(59,109,240,.2); --rail-item:rgba(255,255,255,.05);
  --blur:blur(18px) saturate(150%);
  --g-bg:rgba(22,163,74,.16); --g-bd:rgba(74,222,128,.35); --b-bg:rgba(37,99,235,.2); --p-bg:rgba(147,51,234,.2); --r-bg:rgba(239,68,68,.17);
  --ev-b:rgba(37,99,235,.2); --ev-bt:#9DBBFF; --ev-p:rgba(219,39,119,.18); --ev-pt:#F9A8D4; --ev-v:rgba(168,85,247,.2); --ev-vt:#D8B4FE; --ev-o:rgba(234,88,12,.2); --ev-ot:#FDBA74;
  --ev-sub:#C3CCDA; --ev-ink:#EEF1F6;
  --pal-blue:#7DB0FF; --pal-green:#4ADE80; --pal-red:#FB7185; --pal-ind:#A5A9FF; --pal-ora:#FB923C;
  --hole:transparent; --focus:#9DBBFF;
  color-scheme:dark;
}
/* dark glass (inspired by frosted-glass fitness / wallet dashboards) */
.orb{display:none}
html[data-theme="dark"] .orb{display:block;position:absolute;border-radius:50%;filter:blur(64px);pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(34px,-24px) scale(1.08)}}
html[data-theme="dark"] .card{border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04)),rgba(8,10,26,.5);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border-color:rgba(255,255,255,.2);box-shadow:0 1px 0 rgba(255,255,255,.28) inset,0 -1px 0 rgba(255,255,255,.04) inset,0 24px 48px -18px rgba(0,0,0,.7)}
html[data-theme="dark"] .kpi{border-radius:12px;box-shadow:0 1px 0 rgba(255,255,255,.16) inset}
html[data-theme="dark"] .rbox,html[data-theme="dark"] .pa{border-radius:12px}
html[data-theme="dark"] .pa{background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.03)),rgba(8,10,26,.45);border-color:rgba(255,255,255,.14)}
html[data-theme="dark"] .me{border-radius:16px}
html[data-theme="dark"] .tabs{border-radius:8px}
html[data-theme="dark"] #side{background:linear-gradient(180deg,rgba(24,20,92,.55),rgba(12,10,48,.72))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1500px;height:823px;overflow:hidden;background:var(--page);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
html[data-theme="dark"]{background:#090C14 radial-gradient(900px 620px at 8% -8%,rgba(99,102,241,.42),transparent 62%),radial-gradient(820px 600px at 98% 2%,rgba(14,165,233,.26),transparent 58%),radial-gradient(900px 720px at 62% 112%,rgba(168,85,247,.28),transparent 62%)}
html[data-theme="dark"] body{background:transparent}
#f{position:relative;width:1500px;height:823px;overflow:hidden}
.a{position:absolute}
.card{position:absolute;background:var(--card);border:1px solid var(--card-bd);border-radius:8px;box-shadow:var(--card-sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
svg{display:block}
.ic{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* sidebar */
#side{left:0;top:0;width:259px;height:823px;background:var(--nav);color:var(--nav-txt);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-right:1px solid rgba(255,255,255,.08)}
.logo{font:700 34px/1 Inter,sans-serif;letter-spacing:-.04em;color:#fff;display:flex;align-items:center;gap:7px}
.logo i{display:block;width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#60A5FA,#A78BFA);position:relative}
.logo i:after{content:"";position:absolute;inset:7px;border-radius:50%;border:3px solid #fff;border-bottom-color:transparent;transform:rotate(30deg)}
.org{left:21px;top:14px;width:217px;height:60px}
.org .sq{position:absolute;left:0;top:11px;width:37px;height:37px;border-radius:8px;background:#fff;color:#4C3FD6;display:grid;place-items:center}
.org .mk{display:block;width:21px;height:21px;border-radius:7px;background:linear-gradient(135deg,#60A5FA,#7C5CFF)}
.org b{position:absolute;left:52px;top:8px;font:600 14px/26px Inter;color:#fff}
.org span{position:absolute;left:52px;top:34px;font:400 12px/18px Inter;color:var(--nav-mut)}
.org svg{position:absolute;right:7px;top:18px;color:#EBF0F5}
.create{left:21px;top:87px;width:217px;height:42px;border-radius:6px;background:var(--nav-btn);display:flex;align-items:center;justify-content:center;gap:8px;font:500 14px Inter;color:#fff;border:1px solid rgba(255,255,255,.08)}
.nav-i{position:absolute;left:21px;width:217px;height:42px;border-radius:6px;display:flex;align-items:center;gap:16px;padding-left:10px;font:500 14px Inter;color:var(--nav-txt)}
.nav-i.on{background:var(--nav-act);color:#fff}
.nav-i .ch{position:absolute;right:11px;top:9px;color:#fff}
.nav-bar{position:absolute;left:21px;top:149px;width:4px;height:27px;border-radius:0 3px 3px 0;background:#F59E0B}
.me{left:21px;top:727px;width:221px;height:76px;border-radius:10px;background:linear-gradient(135deg,#3A2FD0,#2A2290);overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.me .av{position:absolute;left:15px;top:19px;width:37px;height:37px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#B45309);display:grid;place-items:center;font:600 13px Inter;color:#fff;border:2px solid rgba(255,255,255,.55)}
.me b{position:absolute;left:67px;top:16px;font:500 14px/26px Inter;color:#fff}
.me span{position:absolute;left:67px;top:42px;font:400 12px/18px Inter;color:#D5DAFF}
.me svg{position:absolute;right:11px;top:26px;color:#fff}
/* header */
#head{left:259px;top:0;width:1241px;height:68px;background:var(--head-bg);border-bottom:1px solid var(--line);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
#head .logo{color:var(--ink);font-size:21px;position:absolute;left:57px;top:19px;gap:5px;height:30px}
#head .logo i{width:17px;height:17px;border-radius:5px}#head .logo i:after{inset:4px;border-width:2px}
#head .tools{position:absolute;left:1031px;top:16px;width:186px;height:36px;color:var(--ink)}
#head .tools svg{position:absolute;top:8px}
#head .tools .ai svg{position:static}
.ai{position:absolute;right:0;top:0;width:36px;height:36px;border-radius:50%}
/* kpis */
.kpi{position:absolute;top:16px;width:212px;height:89px;border-radius:6px;padding:14px;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--bd,transparent)}
.kpi .o{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.kpi b{display:block;font:600 24px/32px Inter;color:var(--ink)}
.kpi span{display:block;margin-top:8px;font:400 14px/14px Inter;color:var(--ink)}
.kpi.add b{font-size:24px}
/* chart cards */
.tabs{position:absolute;left:16px;top:16px;height:32px;display:flex;border-radius:2px;overflow:hidden}
.tabs span{display:grid;place-items:center;height:32px;font:500 16px Inter;padding:0 18px;width:auto!important;min-width:99px;white-space:nowrap;box-sizing:border-box}
.tabs .on{background:var(--tab-on);color:var(--tab-on-t)}.tabs .off{background:var(--tab-off);color:var(--tab-off-t)}
.fun{position:absolute;top:22px;color:var(--ink)}
.st{position:absolute;width:80px}
.st small{display:flex;align-items:center;gap:5px;font:400 14px/16px Inter;color:var(--ink2);white-space:nowrap}
.st small i{width:10px;height:10px;border-radius:50%;display:block;flex:none}
.st b{display:block;margin-top:9px;font:600 20px/24px Inter;color:var(--ink)}
/* calendar */
.cal-h{position:absolute;left:18px;top:21px;display:flex;align-items:center;gap:8px;font:500 16px Inter;color:var(--ink)}
.chips{position:absolute;right:16px;top:15px;display:flex;gap:10px}
.chip{height:32px;border-radius:16px;border:1px solid var(--chip-bd);background:var(--chip-bg);display:flex;align-items:center;gap:6px;padding:0 12px;font:500 12px Inter;color:var(--ink)}
.chip.on{background:#0F9D8F;border-color:#0F9D8F;color:#fff}
.grid{position:absolute;left:15px;top:79px;width:891px;border:1px solid var(--line);border-radius:2px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);height:35px;background:rgba(127,140,160,.07)}
.dow span{padding:10px 8px;font:500 12px/14px Inter;color:var(--ink);border-right:1px solid var(--line)}
.dow span:last-child{border-right:0}
.wk{display:grid;grid-template-columns:repeat(7,1fr);height:104px;border-top:1px solid var(--line)}
.dc{position:relative;border-right:1px solid var(--line);padding:11px 8px;font:400 14px/22px Inter;color:var(--ink)}
.dc:last-child{border-right:0}.dc.mut{color:var(--ink3)}
.ev{position:absolute;left:8px;right:8px;top:47px;border-radius:2px;padding:4px 6px 4px 9px;border-left:3px solid var(--c);background:var(--bg);font:400 8px/1.45 Inter;color:var(--ev-sub);height:45px;overflow:hidden}
.ev b{display:block;font:700 8px/1.45 Inter;color:var(--t)}
.ev em{font-style:normal;color:var(--ev-ink);display:block;font-weight:500}
.ev svg{position:absolute;right:5px;top:4px;color:var(--t)}
.ev.s{height:17px;padding:2px 6px 2px 9px;display:flex;align-items:center;gap:4px;top:auto}
.ev.s b{display:inline}
.cl{position:absolute;right:6px;top:11px;display:flex}
.cl i{width:16px;height:16px;border-radius:50%;margin-left:-5px;border:1.5px solid var(--card);display:grid;place-items:center;font:700 6px Inter;color:#fff;font-style:normal}
/* rail */
.rail-t{position:absolute;left:13px;top:17px;font:600 16px/24px Inter;color:var(--ink)}
.rbox{position:absolute;left:13px;top:56px;width:235px;height:132px;border-radius:6px;background:var(--rail-box);overflow:hidden}
.rbox b{position:absolute;left:17px;top:16px;font:600 24px/32px Inter;color:var(--ink)}
.rbox span{position:absolute;left:17px;top:61px;font:500 14px/14px Inter;color:var(--ink)}
.rbox small{position:absolute;left:17px;top:88px;width:130px;font:400 10px/11px Inter;color:var(--ink2)}
.rbox svg.il{position:absolute;left:142px;top:23px;width:79px;height:90px;color:var(--ink)}
.cr{display:flex}.cr.r svg{transform:rotate(180deg)}.cr.d svg{transform:rotate(-90deg)}
.nav-i .ch svg{opacity:.9}
.pa-t{position:absolute;left:21px;top:203px;font:600 16px/24px Inter;color:var(--ink)}
.pa{position:absolute;left:13px;width:236px;height:72px;border:1px solid var(--line);border-radius:4px;background:var(--rail-item)}
.pa .o{position:absolute;left:7px;top:15px;width:40px;height:40px;border-radius:50%;display:block}
.pa b{position:absolute;left:57px;top:10px;font:600 18px/22px Inter;color:var(--ink)}
.pa span{position:absolute;left:57px;top:38px;width:164px;font:400 14px/20px Inter;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* animation */
.up{animation:up .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade{animation:fade .8s ease both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i,0)*90ms + .6s)}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.seg{animation:seg 1.1s cubic-bezier(.3,.7,.2,1) both;animation-delay:.35s}
@keyframes seg{from{stroke-dasharray:0 var(--tot)}to{stroke-dasharray:var(--len) var(--tot)}}

@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 0 6px rgba(255,255,255,.18)}}
.ai{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,.0)}50%{box-shadow:0 0 14px 3px rgba(139,92,246,.55)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
