<style type="text/tailwindcss">


/*
 * Design tokens pulled from the Figma file (V4 Enhancements › Dashboard Designs 3.0 › Client).
 * Names mirror the Figma variables where they exist.
 */
/* static: emit every token, even ones only referenced from inline styles */
@theme static {
  --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;

  /* Layout / navigation */
  --color-nav: #171272;
  --color-nav-active: #2f27c8;
  --color-nav-text: #b6c4e1;
  --color-nav-tile: #e8e7ff;
  --color-accent: #ff9f18;

  /* Surfaces & text */
  --color-canvas: #f4f6fa;
  --color-ink: #1f1f1f;
  --color-ink-strong: #000000;
  --color-ink-secondary: #666666;
  --color-ink-muted: #595959;
  --color-icon: #001a43;
  --color-line: #e3e9f0;
  --color-line-soft: #f5f5f5;
  --color-tab-idle: #f5f5f5;
  --color-tab-idle-text: #191919;
  --color-highlight: #e9f4ff;

  /* Calendar */
  --color-cal-line: #e9f4ff;
  --color-cal-head: #f9fbff;
  --color-chip-line: #e2e8f0;
  --color-chip-text: #1e293b;
  --color-event-meta: #475569;

  /* Chart series */
  --color-series-blue: #2563eb;
  --color-series-green: #16a34a;
  --color-series-red: #ef4444;
  --color-series-indigo: #6366f1;
  --color-series-orange: #ea580c;

  /* Radii */
  --radius-s: 4px;
  --radius-m: 8px;
  --radius-l: 12px;

  /* Figma "boxShadowTertiary" */
  --shadow-card: 0 1px 2px 0 rgb(0 0 0 / 0.03), 0 1px 6px -1px rgb(0 0 0 / 0.02),
    0 2px 4px 0 rgb(0 0 0 / 0.02);
}

html,
body {
  background: var(--color-canvas);
  color: var(--color-ink);
}

/* Consistent, visible keyboard focus everywhere */
:where(a, button, select, [tabindex]):focus-visible {
  outline: 2px solid var(--color-series-blue);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

/* ---------- Motion ---------- */

/* Loading placeholder */
.skeleton {
  background: linear-gradient(90deg, #eceff4 25%, #f6f8fb 37%, #eceff4 63%);
  background-size: 400% 100%;
  animation: shimmer 1.3s ease-in-out infinite;
}
@keyframes shimmer {
  0% { background-position: 100% 50%; }
  100% { background-position: 0 50%; }
}

/* Staggered widget entrance after each load (delay set inline) */
.widget-enter { animation: widget-rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes widget-rise {
  from { opacity: 0; transform: translateY(14px) scale(0.985); }
  to { opacity: 1; transform: none; }
}

/* Small items (event cards, list rows) */
.fade-up { animation: fade-up 0.42s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes fade-up {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

/* Popovers, toasts, menus */
.pop-in { animation: pop-in 0.18s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes pop-in {
  from { opacity: 0; transform: translateY(4px) scale(0.97); }
  to { opacity: 1; transform: none; }
}

/* Customise bar */
.slide-down { animation: slide-down 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes slide-down {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: none; }
}

/* Height collapse for expanding/removing rows: toggle data-open on a grid wrapper */
.expander { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s; opacity: 0; }
.expander[data-open="true"] { grid-template-rows: 1fr; opacity: 1; }
.expander > * { min-height: 0; overflow: hidden; }

/* Gentle wobble on widgets while customising (stops on hover so controls are easy to hit) */
.edit-wiggle { animation: wiggle 2.4s ease-in-out infinite; }
.edit-wiggle:hover, .edit-wiggle:focus-within { animation: none; }
@keyframes wiggle {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-0.12deg); }
  75% { transform: rotate(0.12deg); }
}

const { arcPath, bisector, layout } = (() => {
    /**
     * Annular-sector path. Angles are radians, 0 = 12 o'clock, increasing clockwise.

        const sweep = a1 - a0;

            return "";

        if (sweep >= Math.PI * 2 - 1e-6) {
            const mid = a0 + Math.PI;
            return arcPath(cx, cy, rOuter, rInner, a0, mid) + arcPath(cx, cy, rOuter, rInner, mid, a0 + Math.PI * 2);

            `A${rOuter} ${rOuter} 0 ${large} 1 ${pt(rOuter, a1)}` +
            `L${pt(rInner, a1)}` +

            const share = sum ? item.value / sum : 0;
            const a0 = a;
            a += span * share;
